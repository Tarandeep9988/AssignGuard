services:
  frontend:
    image: plagshield-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_API_URL: http://backend:4000/api/v1
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: plagshield-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"